  const dec = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  async function unlock(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: dec(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: dec(ENC.iv) }, key, dec(ENC.ct));
    return JSON.parse(new TextDecoder().decode(plain));

  function show(d) {
    document.head.insertAdjacentHTML('beforeend', d.headLinks.join(''));
    document.title = d.title;
    document.body.removeAttribute('style');
    document.body.innerHTML = d.body;
    new Function(d.js)();
    if (location.hash) { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
  }
  const form = document.getElementById('gate'), err = document.getElementById('err');
  async function attempt(pw, remember) {
    try {
      const d = await unlock(pw);
      if (remember) { try { sessionStorage.setItem('cdsaga', pw); } catch (e) {} }
      show(d);
      return true;
    } catch (e) { return false; }
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('go'); btn.disabled = true; err.textContent = '';
    const ok = await attempt(document.getElementById('pw').value, true);
    if (!ok) { err.textContent = 'パスワードが違います。'; btn.disabled = false; }
