  }
  const form = document.getElementById('gate'), err = document.getElementById('err');
  async function attempt(pw, remember) {
    try {
      const d = await unlock(pw);
      if (remember) { try { sessionStorage.setItem('cdsaga', pw); } catch (e) {} }
      show(d);
      return true;

    e.preventDefault();
    const btn = document.getElementById('go'); btn.disabled = true; err.textContent = '';

    if (!ok) { err.textContent = 'パスワードが違います。'; btn.disabled = false; }
