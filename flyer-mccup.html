  <title>CoderDojo さが（関係者向け）</title>
  <link rel="icon" href="assets/logo-mark-t.png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e0f2f6;
      font-family: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
    .gate { background: #fff; border-radius: 20px; padding: 32px 24px; width: min(360px, 92vw); text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
    .gate img { width: 88px; height: auto; }
    .gate h1 { font-size: 20px; margin: 8px 0 4px; }
    .gate p { font-size: 13px; margin: 0 0 16px; color: #555; }
    .gate input { width: 100%; padding: 10px 12px; font-size: 16px; border: 2px solid #86d1a0; border-radius: 8px; box-sizing: border-box; }
    .gate button { margin-top: 12px; width: 100%; padding: 10px; font-size: 16px; border: 0; border-radius: 8px; background: #1493d2; color: #fff; cursor: pointer; }
    .gate button:disabled { opacity: .6; cursor: wait; }
    .err { color: #c0392b; font-size: 13px; min-height: 1.4em; margin: 8px 0 0; }
  </style>
</head>

  <h1>CoderDojo さが</h1>
  <p>このページは関係者向けです。パスワードを入力してください。</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="パスワード" autofocus>
  <button type="submit" id="go">開く</button>
  <p class="err" id="err" role="alert"></p>
</form>

  const dec = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  async function unlock(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: dec(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: dec(ENC.iv) }, key, dec(ENC.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function show(d) {
    document.head.insertAdjacentHTML('beforeend', d.headLinks.join(''));
    document.title = d.title;
    document.body.removeAttribute('style');
    document.body.innerHTML = d.body;
    new Function(d.js)();
    if (location.hash) { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
  }
  const form = document.getElementById('gate'), err = document.getElementById('err');
  async function attempt(pw, remember) {
    try {
      const d = await unlock(pw);
      if (remember) { try { sessionStorage.setItem('cdsaga', pw); } catch (e) {} }
      show(d);
      return true;
    } catch (e) { return false; }
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('go'); btn.disabled = true; err.textContent = '';
    const ok = await attempt(document.getElementById('pw').value, true);
    if (!ok) { err.textContent = 'パスワードが違います。'; btn.disabled = false; }
  });
  let saved = null; try { saved = sessionStorage.getItem('cdsaga'); } catch (e) {}
  if (saved) attempt(saved, false);
})();
